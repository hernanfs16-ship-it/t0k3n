name: Daily Token Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper

      - name: Ejecutar Scraper
        run: python scraper.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Solo intenta hacer commit si el archivo tokens.json existe realmente
          if [ -f tokens.json ]; then
            git add tokens.json
            git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Actualizar tokens mt" && git push)
            echo "Cambios guardados en el repositorio."
          else
            echo "El archivo tokens.json no se generó hoy. Se omite el commit para evitar errores."
          fi
